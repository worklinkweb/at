<style>
:root {
  --paper: #fbf8f5;
  --ink: #141414;
  --muted: #5c5654;
  --rule: #d9d1cc;
  --red: #8f1d22;
  --red-soft: #f6e9e8;
  --card: #ffffff;
  --serif: "Libre Caslon Text", "Noto Serif TC", "Songti TC", serif;
  --serif-tc: "Noto Serif TC", "Songti TC", serif;
  --sans: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.75; font-size: 16px; }
a { color: var(--red); }
.hero > *, .card-head > *, .two > *, .item > *, .sources > *, .prompts > * { min-width: 0; }
p, li, h1, h2, h3, pre { overflow-wrap: anywhere; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
main { min-height: 70vh; padding-bottom: 48px; outline: none; }

/* 報頭 */
.masthead { border-bottom: 1px solid var(--ink); background: var(--paper); position: sticky; top: 0; z-index: 5; }
.masthead-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-weight: 700; letter-spacing: .08em; color: var(--ink); text-decoration: none; font-size: 14px; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--ink); padding: 8px 10px; font-weight: 500; font-size: 15px; border-bottom: 3px solid transparent; }
.nav a.on { border-bottom-color: var(--red); color: var(--red); }
.draft-banner { background: #fff4d6; color: #6b4b00; text-align: center; padding: 6px 16px; font-size: 14px; }

/* 共用排版 */
.kicker { display: inline-block; border-left: 4px solid var(--red); padding-left: 10px; font-family: var(--serif-tc); font-weight: 900; font-size: 15px; letter-spacing: .04em; margin: 28px 0 8px; }
.topline { display: flex; justify-content: space-between; gap: 12px; padding: 16px 0 8px; border-bottom: 1px solid var(--ink); font-family: var(--serif); font-weight: 700; font-size: 13px; letter-spacing: .08em; position: relative; }
.topline > span:last-child { white-space: nowrap; }
.topline::after { content: ""; position: absolute; right: 0; bottom: -3px; width: 90px; height: 5px; background: var(--red); }
h1, h2, h3 { font-family: var(--serif-tc); line-height: 1.25; margin: 0; }
.hero-title { font-size: clamp(44px, 9vw, 96px); font-weight: 900; letter-spacing: -.01em; margin: 8px 0 4px; }
.hero-sub { font-family: var(--serif-tc); font-weight: 600; font-size: clamp(18px, 3vw, 26px); margin: 0 0 16px; }
.redbar { width: 56px; height: 5px; background: var(--red); margin: 12px 0 24px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 40px 0 12px; }
.sec-head .en { font-family: var(--serif); font-weight: 700; font-size: clamp(20px, 3vw, 28px); letter-spacing: .02em; }
.sec-head .zh { font-family: var(--serif-tc); font-weight: 900; font-size: clamp(20px, 3vw, 28px); color: var(--red); border-left: 1px solid var(--muted); padding-left: 12px; }
.lede { color: var(--muted); margin: 0 0 16px; }
.muted { color: var(--muted); }
.date { font-family: var(--serif); color: var(--muted); font-size: 14px; letter-spacing: .04em; }

/* 首頁 */
.hero { display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px; align-items: start; }
.story { border-left: 1px solid var(--ink); padding-left: 24px; margin-top: 24px; }
.story h2 { font-family: var(--serif); color: var(--red); font-size: 20px; letter-spacing: .06em; padding-bottom: 8px; border-bottom: 1px solid var(--muted); margin-bottom: 12px; }
.story p { font-family: var(--serif-tc); font-size: 20px; line-height: 1.7; margin: 0; }
.doors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 8px; }
.door { display: block; background: var(--card); border: 1px solid var(--rule); border-top: 5px solid var(--red); padding: 20px; text-decoration: none; color: var(--ink); }
.door:hover { background: var(--red-soft); }
.door .num { font-family: var(--serif); color: var(--red); font-weight: 700; font-size: 14px; }
.door h3 { font-size: 24px; margin: 4px 0 6px; }
.door p { margin: 0; color: var(--muted); font-size: 15px; }

/* 搜尋與標籤 */
.search { display: flex; gap: 8px; margin: 8px 0 12px; }
.search input { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border: 1px solid var(--ink); background: #fff; border-radius: 0; }
.search button, .btn { font: inherit; font-weight: 500; padding: 10px 16px; background: var(--ink); color: #fff; border: 0; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 0; }
.btn.red { background: var(--red); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; padding: 0; list-style: none; }
.tag { display: inline-block; font-size: 14px; padding: 4px 12px; border: 1px solid var(--red); color: var(--red); background: transparent; text-decoration: none; border-radius: 999px; font-family: var(--sans); cursor: pointer; }
.tag.on, .tag:hover { background: var(--red); color: #fff; }
.filter-note { font-size: 14px; color: var(--muted); margin: 0 0 8px; }

/* 列表 */
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.item { border-bottom: 1px solid var(--rule); padding: 20px 0; display: grid; grid-template-columns: 120px 1fr; gap: 16px; }
.item h3 { font-size: 22px; margin: 2px 0 6px; }
.item h3 a { color: var(--ink); text-decoration: none; }
.item h3 a:hover { color: var(--red); }
.item p { margin: 0 0 8px; color: var(--muted); }
.item .tags { margin: 0; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; background: var(--red-soft); color: var(--red); margin-left: 6px; vertical-align: middle; font-family: var(--sans); }
.badge.draft { background: #fff4d6; color: #6b4b00; }
.empty { padding: 32px 0; color: var(--muted); }

/* 內文 */
.article { max-width: 760px; }
.article h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 900; margin: 16px 0 8px; }
.article h2 { font-size: 22px; margin: 32px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.article ul, .article ol, .panel ul { padding-left: 1.3em; margin: 8px 0; }
.article li, .panel li { margin: 4px 0; }
code { font-family: ui-monospace, Menlo, monospace; background: var(--red-soft); padding: 1px 5px; font-size: .9em; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.callout { background: var(--red-soft); border-left: 4px solid var(--red); padding: 14px 18px; margin: 24px 0; }
.callout a { font-weight: 700; }

/* 指令卡 */
.card-head { display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px; align-items: start; }
.card-title { font-size: clamp(40px, 8vw, 84px); font-weight: 900; margin: 8px 0 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; border-top: 1px solid var(--ink); margin-top: 24px; }
.two > section + section { border-left: 1px solid var(--rule); padding-left: 32px; }
.panel { background: var(--card); border: 1px solid var(--rule); padding: 4px 18px; margin: 8px 0; }
.panel h3 { font-size: 17px; margin: 12px 0 0; }
.panel.not h3 { color: var(--muted); }
.steps { list-style: none; padding: 0; margin: 8px 0; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; background: var(--red-soft); padding: 12px 16px; margin: 0 0 10px; border-radius: 12px; }
.steps li::before { content: counter(s, decimal-leading-zero); width: 48px; height: 48px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 18px; }
.prompts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.prompt { background: var(--red-soft); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.prompt .label { font-family: var(--serif-tc); font-weight: 900; color: var(--red); font-size: 18px; }
.prompt pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--serif-tc); font-weight: 600; font-size: 18px; border-left: 4px solid var(--red); padding-left: 12px; }
.prompt .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.ask { margin-top: 16px; border: 1px solid var(--red); padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
.ask strong { color: var(--red); font-family: var(--serif-tc); }
.sources { border-top: 1px solid var(--ink); margin-top: 32px; padding-top: 12px; display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
.sources h2 { font-family: var(--serif); font-size: 20px; margin: 0; border: 0; padding: 0; }
.sources ul { margin: 0; padding-left: 1.2em; }

/* 第二色：指令卡用深藍，和日誌的紅色區隔 */
.card-theme { --red: #1f3d63; --red-soft: #e8eef6; }

/* 左側章節欄（雜誌目錄） */
.with-chapters { display: grid; grid-template-columns: 190px 1fr; gap: 40px; align-items: start; margin-top: 24px; }
.with-chapters > * { min-width: 0; }
.chapters { position: sticky; top: 76px; border-top: 5px solid var(--red); padding-top: 12px; }
.chapters-label { font-family: var(--serif); font-weight: 700; font-size: 12px; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.chapters ol { list-style: none; margin: 0; padding: 0; }
.chapters button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 36px 1fr; gap: 6px; width: 100%; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--ink); }
.chapters button:hover .ch-title, .chapters button.on .ch-title { color: var(--red); font-weight: 700; }
.chapters button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.ch-num { font-family: var(--serif); font-weight: 700; color: var(--red); }
.chapters button.on { box-shadow: inset 4px 0 0 var(--red); padding-left: 10px; }
.chapters button.is-card { margin-top: 10px; background: #1f3d63; color: #fff; padding: 10px 10px; border: 0; }
.chapters button.is-card .ch-num, .chapters button.is-card .ch-title { color: #fff; }
.chapters button.is-card.on { box-shadow: inset 4px 0 0 #8f1d22; }
.with-chapters section, .with-chapters [id^="ch-"] { scroll-margin-top: 80px; }
.h-num { font-family: var(--serif); color: var(--red); margin-right: 10px; }
.with-chapters .article { max-width: none; }
.with-chapters .article h1 { margin-top: 0; }

/* 日誌下方的指令卡區塊 */
.cardblock { margin-top: 48px; border: 2px solid var(--red); background: #fff; }
.cardblock-band { display: flex; justify-content: space-between; background: var(--red); color: #fff; padding: 10px 20px; font-family: var(--serif-tc); font-weight: 900; letter-spacing: .06em; }
.cardblock-inner { padding: 8px 24px 16px; }
.cardblock-title { font-size: clamp(28px, 5vw, 44px); font-weight: 900; margin: 16px 0 4px; }
.cardblock .two { margin-top: 12px; }
.cardblock .sec-head .en, .cardblock .sec-head .zh { font-size: clamp(18px, 2.2vw, 22px); }
.chapters button.is-card { grid-template-columns: auto 1fr; gap: 10px; }

/* 路徑導覽 */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; padding: 14px 0 0; color: var(--muted); }
.crumbs a { color: var(--ink); text-decoration: none; font-weight: 500; }
.crumbs a:hover { color: var(--red); text-decoration: underline; }
.crumbs .here { color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs .sep { color: var(--rule); }

/* 章節欄的展開／收合列（電腦版隱藏） */
.chapters summary { display: none; }
.chapters summary::-webkit-details-marker { display: none; }

.jump { margin: 4px 0 8px; }
.prereq { background: #fff8e6; border-left: 4px solid #b7791f; padding: 10px 16px; margin: 0 0 16px; font-size: 15px; }
.prereq strong { display: block; color: #7a4f0c; margin-bottom: 2px; }
.prereq ul { margin: 4px 0; padding-left: 1.2em; }
.prereq p { margin: 4px 0; }

/* 右下角回首頁（所有尺寸都顯示，首頁除外） */
.fab-home { display: none; }
@media all {
  .fab-home:not([hidden]) { display: flex; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 8; width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: #fff; text-decoration: none; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; line-height: 1; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .fab-home span { font-size: 11px; margin-top: 3px; }
}
.site-footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--ink); padding-top: 12px; padding-bottom: 32px; font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.toast.show { opacity: 1; }

/* 平板與手機 */
@media (max-width: 820px) {
  .with-chapters { grid-template-columns: 1fr; gap: 16px; }
  .chapters { position: static; border-top-width: 3px; padding-top: 0; background: #fff; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .chapters summary { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 12px 14px; font-weight: 700; list-style: none; }
  .chapters[open] .chev { transform: rotate(180deg); }
  .chapters .chapters-label { display: none; }
  .chapters ol { padding: 0 12px 12px; }
  .chapters ol { display: flex; flex-wrap: wrap; gap: 6px; }
  .chapters li { flex: 0 0 auto; }
  .chapters button { grid-template-columns: auto auto; border: 1px solid var(--rule); padding: 4px 10px; font-size: 14px; background: #fff; }
  .chapters button.is-card { margin-top: 0; padding: 4px 10px; }
  .chapters button.on { box-shadow: none; padding-left: 10px; }
  .cardblock-inner { padding: 4px 14px 12px; }
  .hero, .card-head, .two { grid-template-columns: 1fr; gap: 8px; }
  .two > section + section { border-left: 0; padding-left: 0; }
  .story { border-left: 0; padding-left: 0; border-top: 1px solid var(--ink); padding-top: 12px; }
  .doors { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  main { padding-bottom: 96px; }
  body { font-size: 17px; line-height: 1.8; }
  .masthead { position: static; }
  .with-chapters section, .with-chapters [id^="ch-"] { scroll-margin-top: 12px; }
  .article h2 { font-size: 21px; margin-top: 28px; }
  .article li, .panel li { margin: 8px 0; }
  .lede { font-size: 16px; }
  .tag { font-size: 14px; padding: 5px 12px; }
  .sec-head { margin: 28px 0 10px; }
  .story p { font-size: 17px; }
  .prompt pre { font-size: 17px; }
  .prompt .btn, .ask .btn { min-height: 44px; }
  .ask { flex-direction: column; align-items: stretch; }
  .ask .btn { justify-content: center; }
  .panel { padding: 4px 14px; }
  .cardblock { margin-left: -8px; margin-right: -8px; }
  .top3 { padding: 10px 14px 6px; }
  .search button { min-width: 64px; }
  .masthead-row { padding-top: 6px; padding-bottom: 6px; }
  .nav a { padding: 6px 8px; font-size: 14px; }
  .item { grid-template-columns: 1fr; gap: 2px; }
  .sources { grid-template-columns: 1fr; }
  .story p { font-size: 18px; }
}

.with-chapters .card-title { font-size: clamp(36px, 5.5vw, 64px); }

/* 這次學到的 3 件事 */
.top3 { border: 1px solid var(--ink); border-top: 5px solid var(--red); background: #fff; padding: 12px 18px 8px; margin: 16px 0; }
.top3-head { font-family: var(--serif-tc); font-weight: 900; font-size: 18px; color: var(--red); }
.top3 ol { list-style: none; counter-reset: t; margin: 6px 0 0; padding: 0; }
.top3 li { counter-increment: t; display: grid; grid-template-columns: 30px 1fr; gap: 6px; padding: 8px 0; border-top: 1px solid var(--rule); font-weight: 500; }
.top3 li:first-child { border-top: 0; }
.top3 li::before { content: counter(t); font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--red); line-height: 1.4; }

/* 搜尋篩選列 */
.filter-bar { border: 1px solid var(--ink); background: #fff; padding: 12px 16px; margin: 4px 0 16px; display: grid; gap: 8px; }
.filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.filter-label { font-weight: 700; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; text-decoration: none; padding: 5px 12px; border-radius: 999px; font-size: 14px; min-height: 34px; }
.chip b { font-weight: 400; opacity: .8; }
.chip:hover { background: var(--red); }
.count { font-size: 18px; font-family: var(--serif-tc); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.filter-other { margin: 0; font-size: 14px; color: var(--muted); }

/* 首屏重點區（2026-11-22 精簡版） */
.lead { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px 32px; align-items: start; padding: 12px 0 16px; border-bottom: 1px solid var(--ink); }
.lead > * { min-width: 0; }
.lead .kicker { margin: 4px 0 6px; font-size: 13px; }
.lead h1 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 900; line-height: 1.3; margin: 0 0 4px; }
.lead .card-title { font-size: clamp(28px, 4vw, 42px); margin: 0 0 4px; }
.lead .lede { margin: 6px 0 8px; color: var(--ink); }
.lead .tags { margin: 4px 0 0; }
.lead .top3 { margin: 4px 0 0; }
.meta { margin: 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.meta .dot { color: var(--rule); }
.meta a { color: var(--muted); }
.card-lead { grid-template-columns: 1fr; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 4px 0 0; }
.quick > * { min-width: 0; }
.quick-col { background: var(--red-soft); padding: 10px 16px; }
.quick-col h3 { font-size: 16px; margin: 2px 0 4px; color: var(--red); }
.quick-col ul { margin: 0; padding-left: 1.2em; }
.quick-col li { margin: 2px 0; }
.quick-col.notes { background: #fff8e6; }
.quick-col.notes h3 { color: #7a4f0c; }
.quick-col .sub { margin: 6px 0 0; font-weight: 700; font-size: 14px; color: var(--muted); }
.quick-go { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.with-chapters { margin-top: 16px; }
.log-sec h2 { margin-top: 20px; }
.cardblock { margin-top: 32px; }
.cardblock .quick { margin-top: 8px; }
.cardblock-title { font-size: clamp(22px, 3vw, 30px); margin: 12px 0 4px; }
.top3 { padding: 10px 16px 4px; border-top-width: 4px; }
.top3-head { font-size: 16px; }
.top3 li { padding: 6px 0; grid-template-columns: 24px 1fr; }
.top3 li::before { font-size: 18px; }
.sec-head { margin: 28px 0 10px; }
.sec-head .en, .sec-head .zh { font-size: clamp(18px, 2.2vw, 22px); }
.steps li { padding: 8px 14px; margin-bottom: 8px; grid-template-columns: 36px 1fr; }
.steps li::before { width: 36px; height: 36px; font-size: 15px; }

@media (max-width: 820px) {
  .lead, .quick { grid-template-columns: 1fr; }
  .lead:not(.card-lead) { display: flex; flex-direction: column; gap: 0; }
  .lead:not(.card-lead) .lead-main { display: contents; }
  .lead:not(.card-lead) .top3 { margin: 10px 0; }
  .lead:not(.card-lead) .tags { order: 3; }
}
@media (max-width: 560px) {
  .masthead-row { flex-wrap: nowrap; min-height: 48px; gap: 6px; }
  .brand { font-size: 11px; letter-spacing: .03em; white-space: nowrap; }
  .nav { gap: 0; }
  .nav a { padding: 6px 6px; font-size: 13px; white-space: nowrap; }
  .crumbs { padding-top: 8px; font-size: 13px; }
  .crumbs { flex-wrap: nowrap; }
  .crumbs .here { flex: 1 1 0; min-width: 0; }
  .lead { padding: 6px 0 12px; gap: 10px; }
  .lead h1 { font-size: 23px; }
  .lead .card-title { font-size: 28px; }
  .lead .tags .tag { font-size: 13px; padding: 3px 10px; }
  .quick-col { padding: 8px 12px; }
  .sec-head .en, .sec-head .zh { font-size: 18px; }
}

/* ===== 2026-11-23：回首頁、本日收穫指令卡、撲克牌式指令卡 ===== */
.brand { display: inline-flex; align-items: center; gap: 8px; }
.brand-home { display: inline-grid; place-items: center; width: 30px; height: 30px; background: var(--red); color: #fff; font-size: 18px; line-height: 1; border-radius: 6px; }
.brand-zh { font-family: var(--serif-tc); font-weight: 900; font-size: 17px; letter-spacing: .02em; }
.brand-en { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.brand:hover .brand-zh { color: var(--red); }
.fab-home:hover { background: var(--red); }

/* 日誌首屏：右欄放本日收穫指令卡 */
.lead.has-harvest { grid-template-columns: 1.5fr 1fr; }
.lead.has-harvest .top3 { margin: 10px 0 6px; }
.harvest { justify-self: end; width: 100%; max-width: 330px; }
.harvest-head { font-family: var(--serif-tc); font-weight: 900; font-size: 15px; color: var(--red); border-left: 4px solid var(--red); padding-left: 8px; margin: 4px 0 8px; }

/* ===== 2026-11-23 第二版：技能牌卡共用模板（深藍＝完整卡、奶油白＝卡冊小卡） ===== */
.bcard { --gold: #c6a15b; --navy: #1c3658; --ink2: #1a2d48; --s: #1c3658; position: relative; display: flex; flex-direction: column; border-radius: 18px; padding: 18px 18px 14px; outline: 1.5px solid var(--gold); outline-offset: -7px; box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 10px 24px rgba(20,32,56,.2); text-align: left; }
.bcard.navy { background: radial-gradient(120% 55% at 50% 0%, #2a5584 0%, rgba(42,85,132,0) 62%), linear-gradient(170deg, #21426a, #162b48); color: #fff; }
.bcard.cream { background: linear-gradient(170deg, #fffaf0, #f5ead4); color: var(--ink2); }
.bc-head { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; gap: 10px; align-items: center; }
.bc-emblem { width: 64px; height: 61px; display: block; }
.bc-emblem .laurel { fill: var(--gold); }
.bc-emblem .shield { fill: var(--s); stroke: var(--gold); stroke-width: 2.5; stroke-linejoin: round; }
.bc-emblem .shine { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 1.5; }
.bc-emblem .glyph { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bc-series { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.bc-ribbon { background: var(--s); color: #fff; font-family: var(--serif-tc); font-weight: 900; font-size: 15px; letter-spacing: .14em; line-height: 1.5; padding: 2px 20px 2px 12px; clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 50%, 100% 100%, 0 100%); }
.bc-sdesc { font-size: 13px; font-weight: 500; letter-spacing: .06em; opacity: .88; }
.bc-fav { position: relative; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--gold); cursor: pointer; padding: 0; }
.bcard.cream .bc-fav { color: var(--navy); }
.bc-fav svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.bc-fav.on svg { fill: currentColor; }
.bc-fav:hover { background: rgba(198,161,91,.18); }
.bc-fav:focus-visible, .bc-copy:focus-visible { outline: 3px solid #e2c27f; outline-offset: 2px; }
.bc-code { margin: 10px 0 0; display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 12px; letter-spacing: .16em; color: var(--gold); }
.bcard.cream .bc-code { color: #9a7a3c; }
.bc-code em { font-style: normal; letter-spacing: 0; background: #fff4d6; color: #6b4b00; padding: 0 8px; border-radius: 4px; font-family: var(--sans); }
.bc-name { font-family: var(--serif-tc); font-weight: 900; font-size: 34px; line-height: 1.2; letter-spacing: .02em; margin: 2px 0 0; color: inherit; }
.bcard.cream .bc-name { color: var(--navy); }
.bc-name a { color: inherit; text-decoration: none; }
.bc-link::after { content: ""; position: absolute; inset: 0; border-radius: 18px; z-index: 1; }
.bc-swash { height: 3px; width: 62%; margin: 8px 0 10px; border-radius: 2px; background: linear-gradient(90deg, var(--gold), rgba(198,161,91,0)); }
.bc-use { margin: 6px 0 14px; font-size: 17px; line-height: 1.6; font-weight: 500; }
.bcard.navy .bc-use { color: #f4ecd9; margin-top: 0; }
.bc-panel { background: #fdf9f1; color: var(--ink2); border: 1px solid rgba(198,161,91,.55); border-radius: 12px; padding: 2px 16px; flex: 1; }
.bcard.cream .bc-panel { background: rgba(255,255,255,.7); }
.bc-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid #ebe0cb; }
.bc-panel > :first-child { border-top: 0; }
.bc-lab { margin: 0; display: flex; align-items: flex-start; gap: 6px; font-family: var(--serif-tc); font-weight: 900; font-size: 16px; line-height: 1.6; color: var(--navy); }
.bc-notes .bc-lab { color: #9a5b0c; }
.bc-lab svg, .bc-ptitle svg, .bc-foot svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bc-lab svg { margin-top: 2px; }
.bc-list { list-style: none; margin: 0; padding: 0; }
.bc-list li { position: relative; padding-left: 14px; margin: 2px 0; font-size: 16px; line-height: 1.6; }
.bc-list li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.bc-notes .bc-list li { font-size: 15px; color: #4a4440; }
.bc-prompts { padding: 12px 0 6px; border-top: 1px solid #ebe0cb; }
.bc-ptitle { margin: 0 0 4px; display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; font-family: var(--serif); font-weight: 700; font-size: 16px; padding: 4px 24px 4px 12px; border-radius: 4px 0 0 4px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); }
.bc-prompt { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label btn" "text text"; gap: 2px 8px; align-items: center; background: #edf2f8; border-radius: 10px; padding: 4px 10px 12px 12px; margin: 8px 0; }
.bc-plabel { grid-area: label; justify-self: start; background: #d9e6f5; color: #1f4f86; font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 999px; }
.bc-prompt pre { grid-area: text; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--sans); font-weight: 700; font-size: 16px; line-height: 1.55; color: var(--ink2); }
.bc-prompt .ph { white-space: nowrap; color: #9a5b0c; background: #fff3d9; border-radius: 4px; padding: 0 3px; }
.bc-copy { grid-area: btn; justify-self: end; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--navy); cursor: pointer; padding: 0; }
.bc-copy svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.bc-copy:hover { background: #d9e6f5; }
.bc-use, .bc-list li, .bc-prompt pre { text-align: justify; text-align-last: start; text-justify: inter-character; }
.bc-prompt pre.bc-prompt-outline { font-weight: 400; }
.bc-prompt-outline strong { font-weight: 700; }
.bc-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding: 10px 4px 0; border-top: 1px solid rgba(198,161,91,.45); font-size: 14px; color: var(--gold); }
.bcard.cream .bc-foot { color: var(--navy); }
.bc-foot span { display: inline-flex; align-items: center; gap: 6px; }
.bc-foot a { color: inherit; position: relative; z-index: 2; }
.bc-foot .bc-prepared { justify-content: center; min-height: 20px; padding: 2px 6px; border: 1px solid currentColor; border-radius: 4px; font: 700 11px/1 var(--sans); white-space: nowrap; }
.bc-go { font-weight: 700; }

/* 卡冊小卡（奶油白） */
.bcard.mini { padding: 14px 14px 12px; transition: transform .18s, box-shadow .18s; }
.bcard.mini:hover, .bcard.mini:focus-within { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(20,32,56,.26); }
.bcard.mini .bc-head { grid-template-columns: 52px minmax(0, 1fr) 44px; }
.bcard.mini .bc-emblem { width: 52px; height: 50px; }
.bcard.mini .bc-name { font-size: 25px; }
.bcard.mini .bc-use { font-size: 16px; margin-bottom: 10px; }
.bcard.mini .bc-row { grid-template-columns: 1fr; gap: 2px; padding: 8px 0; }
.bcard.mini .bc-list li { font-size: 15px; }
.bcard.mini .bc-link:focus-visible { outline: none; }
.bcard.mini:has(.bc-link:focus-visible) { outline: 3px solid #8f1d22; outline-offset: 2px; }
.bcard.compact .bc-name { font-size: 22px; }
.bcard.compact .bc-use { margin-bottom: 4px; }
.bc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; margin: 8px 0 16px; align-items: stretch; }
.bc-grid .bcard { max-width: 360px; }

/* 系與收藏的篩選按鈕 */
.series-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.sbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 5px 14px 5px 6px; border: 1px solid var(--rule); border-radius: 999px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; }
.sbtn b { font-weight: 500; font-size: 13px; color: var(--muted); }
.sbtn:hover { border-color: var(--ink); }
.sbtn.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: #f3efe8; }
.sdot { width: 28px; height: 28px; border-radius: 50%; background: var(--s); display: grid; place-items: center; }
.sdot svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sbtn.fav { padding-left: 12px; }
.sbtn svg.i-bm, .more-links svg, .fav-empty svg { width: 18px; height: 18px; fill: #1f3d63; stroke: #1f3d63; stroke-width: 1.8; stroke-linejoin: round; vertical-align: -3px; margin: 0 3px; }
.more-links { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0 0 8px; font-weight: 700; }
.more-links a { color: #1f3d63; }
.door-card { border-top-color: #1f3d63; }
.door-card .num { color: #1f3d63; }

/* 完整卡 */
.bcard.full { max-width: 480px; width: 100%; }
.card-stage { margin-top: 40px; padding-top: 4px; border-top: 5px solid var(--red); }
.card-stage .bcard.full { margin: 8px 0 0; }
.stage-links { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 14px 0 0; }
.card-page { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 40px; align-items: start; margin-top: 20px; }
.card-side .meta { font-size: 15px; }
.card-side .meta a { color: var(--red); font-weight: 700; }
.howto { background: var(--red-soft); padding: 10px 14px; margin: 12px 0; }
.card-side .sources { grid-template-columns: 1fr; gap: 4px; margin-top: 20px; }

@media (max-width: 820px) {
  .lead.has-harvest { display: flex; }
  .harvest { order: 2; justify-self: auto; max-width: 320px; margin: 10px auto 4px; }
  .card-page { grid-template-columns: 1fr; gap: 20px; }
  .card-page .bcard.full { margin: 0 auto; width: 100%; }
  .card-stage .bcard.full { margin: 8px auto 0; }
}
@media (max-width: 560px) {
  .brand-en { display: none; }
  .brand-zh { font-size: 15px; }
  .brand-home { width: 28px; height: 28px; }
  .bc-grid { grid-template-columns: 1fr; justify-items: center; }
  .bc-grid .bcard { width: 100%; max-width: 420px; }
  .bcard.full { padding: 16px 14px 12px; border-radius: 16px; }
  .bcard.full .bc-name { font-size: 30px; }
  .bc-panel { padding: 2px 12px; }
  .bc-row { grid-template-columns: 1fr; gap: 2px; }
  .bc-use { font-size: 16px; }
}
@media (min-width: 821px) {
  .fab-home:not([hidden]) { width: 64px; height: 64px; right: 24px; bottom: 24px; }
}

/* ===== 2026-11-23 v1.3：領域顏色、說明頁 ===== */
.bc-domain { letter-spacing: .06em; font-family: var(--sans); font-weight: 700; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; line-height: 1.6; }
.sbtn.dom { padding-left: 8px; }
.ddot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c6a15b; }
.sbtn.navy .ddot, .ab-sw.navy { background: linear-gradient(170deg, #21426a, #162b48); }
.sbtn.cream .ddot, .ab-sw.cream { background: linear-gradient(170deg, #fffaf0, #f5ead4); }
.ab-swatches { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px; }
.ab-sw { min-width: 150px; padding: 14px 18px; border-radius: 14px; outline: 1.5px solid #c6a15b; outline-offset: -6px; font-size: 15px; }
.ab-sw b { display: block; font-family: var(--serif-tc); font-size: 20px; }
.ab-sw.navy { color: #fff; }
.ab-sw.cream { color: #1c3658; }
.ab-series { list-style: none; padding: 0; }
.ab-series li { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.ab-note { background: #fff4d6; padding: 10px 14px; border-radius: 8px; }
.ab-h3 { font-family: var(--serif-tc); font-size: 18px; margin: 20px 0 6px; }
.ab-log { list-style: none; padding: 0; margin: 0; }
.ab-log li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.ab-log a { margin: 0 4px; }
.ab-date { font-family: var(--serif); font-weight: 700; color: var(--red); }
.site-footer #built a { color: inherit; }
@media (max-width: 560px) { .ab-log li { grid-template-columns: 1fr; gap: 0; } }

.ab-code-table { width: 100%; max-width: 32rem; border-collapse: collapse; margin: 12px 0 18px; }
.ab-code-table caption { text-align: left; font-weight: 700; margin-bottom: 4px; }
.ab-code-table th, .ab-code-table td { text-align: left; border-bottom: 1px solid var(--rule); padding: 4px 8px; }

/* v1.5 指令卡分類：電腦左欄，手機移到卡片上方 */
.card-layout { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 12px; }
.card-main { min-width: 0; }
.card-main .card-page { margin-top: 0; }
.card-nav { position: sticky; top: 72px; border-top: 3px solid var(--red); padding-top: 8px; }
.card-nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.cnav-link { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; }
.cnav-link:hover { background: var(--red-soft); }
.cnav-link:focus-visible { outline: 3px solid var(--red); outline-offset: 1px; }
.cnav-link.on { background: var(--red); color: #fff; font-weight: 700; }
.cnav-name { flex: 1; min-width: 0; white-space: nowrap; }
.cnav-link b { font-size: 13px; font-weight: 700; opacity: .8; }
.cnav-link > svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.cnav-link .sdot { flex: none; }
@media (max-width: 1120px) { .card-main .card-page { grid-template-columns: minmax(0, 480px); gap: 20px; } }
@media (max-width: 820px) {
  .card-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .card-nav { position: static; border-top: 0; padding-top: 0; }
  .card-nav ul { display: flex; flex-wrap: wrap; gap: 6px; }
  .cnav-link { border: 1px solid var(--rule); background: #fff; border-radius: 999px; padding: 4px 12px; }
  .cnav-link.on { border-color: var(--red); background: var(--red); }
}

/* 首頁快速指令 */
.quick-bar { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); align-items: stretch; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.quick-label { align-self: center; min-width: 4.5em; font-size: 13px; font-weight: 700; color: var(--muted); margin-right: 4px; }
.quick-bar.x { grid-template-columns: auto repeat(4, minmax(0, 1fr)); }
.quick-btn { font: inherit; min-width: 0; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; line-height: 1.35; background: var(--card); color: var(--ink); border: 1px solid var(--ink); cursor: pointer; }
.quick-text { min-width: 0; display: flex; flex-direction: column; }
.quick-text strong { font-size: 14px; font-weight: 700; }
.quick-text small { font-size: 12px; color: var(--muted); }
.quick-btn:hover { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.quick-btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.quick-btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 820px) {
  .quick-bar, .quick-bar.x { grid-template-columns: 1fr; gap: 6px; }
  .quick-label { display: none; }
  .quick-bar.x .quick-label { display: block; }
  .quick-btn { min-height: 40px; }
  .quick-text { flex-direction: row; align-items: baseline; gap: 8px; }
  .quick-text strong { flex: none; }
}

/* v1.8：一篇多卡、完整資料、相關卡 */
.harvest-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.harvest-list a { display: grid; gap: 2px; min-height: 44px; padding: 10px 12px; border: 1px solid var(--gold, #c6a15b); border-radius: 10px; background: #fffaf0; color: #16294a; text-decoration: none; }
.harvest-list a:hover { background: #fff3da; }
.harvest-list span { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: #7c6230; }
.harvest-list strong { font-family: var(--serif-tc); font-size: 18px; line-height: 1.35; }
.bc-more { margin-top: 14px; border-top: 1px solid rgba(198,161,91,.55); padding-top: 4px; }
.bc-more summary { min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; cursor: pointer; font-weight: 700; }
.bc-more summary small { font-weight: 500; font-size: 13px; opacity: .82; }
.bc-more summary:focus-visible { outline: 3px solid #e2c27f; outline-offset: 2px; }
.bm-sec { margin: 8px 0 14px; font-size: 15px; line-height: 1.65; }
.bm-sec h5 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
.bm-sec ul, .bm-sec ol { margin: 0; padding-left: 20px; }
.bm-sec p { margin: 0; }
.bm-sec a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.bm-status p { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }
.bm-sec ul.bm-practice { list-style: none; padding: 0; display: grid; gap: 8px; }
.bm-practice li { padding: 10px 12px; border: 1px solid rgba(198,161,91,.55); border-radius: 8px; min-width: 0; }
.bm-practice small { margin-left: 8px; opacity: .8; white-space: nowrap; }
.bm-state { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 4px; background: rgba(198,161,91,.25); font-size: 13px; font-weight: 700; }
.bm-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.related-cards { margin: 20px 0; }
.related-cards h2 { margin: 0 0 6px; font-size: 18px; }

      "內容常更新，不想每次手動上傳。"

       "label": "",
       "text": "請幫我把這個網站發布成「人看要密碼、AI 有專用網址」。先不要上傳，先回報計畫等我確認。\n1. 盤點：列出要公開的內容，檢查路徑、Email、金鑰、私人網址和 Git 歷史。\n2. AI 閱讀頁：產生不需執行程式就能讀的純文字頁，標示版本與更新日期。\n3. 人看入口：用 StatiCrypt 加密後放 GitHub Pages，只上傳成品。\n4. AI 入口：放不公開列出的 Gist，並提醒我拿到網址的人都能讀。\n5. 密碼：由我本人輸入並存在 macOS 鑰匙圈，不要讓 AI 看到。\n6. 核對：上傳後用未登入狀態讀回線上內容並比對版本，沒對上就回報失敗。",
       "en": "Help me publish this website so people need a password and AI has its own URL. Do not upload yet. First report the plan and wait for my approval.\n1. Inventory: list what will be public, and check for file paths, emails, keys, private URLs, and Git history.\n2. AI reading page: create a plain-text page that works without running code, with the version and update date.\n3. Human entrance: encrypt it with StatiCrypt and put it on GitHub Pages. Upload only the finished page.\n4. AI entrance: put it in an unlisted Gist, and remind me that anyone with the URL can read it.\n5. Password: I will type it myself and store it in the macOS Keychain. Do not let the AI see it.\n6. Check: after upload, read the live content while logged out and compare the version. If it does not match, report a failure."
      }

     "html": "<p>製作可逐年擴充的國中學習網站。</p>"

    {
     "title": "怎麼做",
     "html": "<ol><li>用公開地圖資料製作可旋轉地球儀。</li><li>先訂故事規則，再編寫教材內容。</li><li>把教材內容與網站程式分開，方便新增章節。</li></ol>"

     "code": "AI-003",
     "name": "網站規格",
     "use": "開發學習網站前，先把初衷、規則、內容來源和工具整理成一頁規格。",
     "when": [
      "想把教材做成互動學習網站或系統。",
      "想從單次網頁，升級成能持續擴充的系統。"
     ],
     "notes": [
      "限制：這段是依本專案實際做法整理的模板。",
      "提醒：課本、題庫和動漫圖片要公開前，先確認授權。",
      "提醒：第 6 點的工具判斷細節，見 AI-006。"
     ],
     "prompts": [
      {
       "label": "",
       "text": "請協助我開發學習網站系統。先不要寫程式，先整理成一頁開發規格，等我確認。\n1. 初衷：為誰做、想解決什麼、對方最喜歡什麼？<使用者與興趣>\n2. 世界規則：用對方的興趣建立故事世界，讓學科知識成為世界裡的規則。\n3. 角色分工：每個角色只負責一種學習功能，不當裝飾。\n4. 學會標準：定義已讀、已完成、待補強、已補強；閱讀不能代替作答。\n5. 內容來源：保留課本與題庫附圖，標示來源；AI 自編或自解的內容要註明。\n6. 工具判斷：列出每項功能用什麼技能或工具、是否真的需要外部 API。\n7. 試用修正：先做一個單元，給使用者實際操作，再依回饋增刪功能。",
       "en": "Please help me build a learning website. Do not write code yet. First write a one-page spec and wait for my approval.\n1. Purpose: who is it for, what problem does it solve, and what do they love most? <user and interests>\n2. World rules: build a story world from their interests, and make the subject knowledge the rules of that world.\n3. Roles: each character does one learning job only, not decoration.\n4. Mastery: define read, done, needs work, and improved. Reading does not replace answering questions.\n5. Sources: keep the figures from textbooks and question banks, and label sources. Mark content the AI wrote or solved itself.\n6. Tools: list the skill or tool for each feature, and whether an external API is really needed.\n7. Test and revise: build one unit first, let the user try it, then add or cut features based on feedback."
      }
     ],

     "code": "AI-005",
     "name": "互動地圖",
     "use": "用 d3-geo 和 Natural Earth，把地點、路線和區域做成可操作的互動地圖。",
     "when": [
      "要讓人理解地點、路線或區域關係。",
      "教材、課程或簡報需要可操作的地圖。"
     ],
     "notes": [
      "限制：現代地理資料不等於聖經或其他歷史時代的地理。",
      "提醒：公開前要確認地圖資料授權與國界呈現。"
     ],
     "prompts": [
      {
       "label": "",
       "text": "請幫我做一個互動地圖，先不要寫程式，先確認：\n1. 目標：使用者是誰、看完要理解什麼？<對象與目標>\n2. 內容：要呈現哪些地點、路線或區域？<內容>\n3. 資料：屬於現代地理或歷史地理？歷史地名、國界和路線的來源是什麼？\n4. 工具：優先評估 d3-geo 與 Natural Earth；資料不常變動時放進網站，不使用 API。\n5. 試做：先做一個地點或一段路線給我試用，確認後再擴充。\n6. 回報：列出已實作、已測試、尚未驗證的項目，以及所有資料來源。",
       "en": "Please help me make an interactive map. Do not write code yet. First confirm:\n1. Goal: who is the user, and what should they understand after using it? <audience and goal>\n2. Content: which places, routes, or areas to show? <content>\n3. Data: is it modern or historical geography? What are the sources for historical place names, borders, and routes?\n4. Tools: evaluate d3-geo and Natural Earth first. If the data rarely changes, put it in the website and do not use an API.\n5. Trial: build one place or one route for me to try, then expand after I confirm.\n6. Report: list what is built, what is tested, what is not yet verified, and all data sources."
      }
     ],

    return '<button type="button" class="bc-fav' + (on ? ' on' : '') + '" data-fav="' + esc(e.id) + '" aria-pressed="' + on + '" aria-label="' + (on ? '取消收藏' : '加入我的收藏') + '：' + esc(e.card.name) + '" title="' + (on ? '取消收藏' : '加入我的收藏') + '">' + ICON.bookmark + '</button>';
  }
  function fmtDate(d) { return String(d).replace(/-/g, '.'); }

  function preparedBadge(name) {
    if (!name) return '';
    var tool = esc(name);
    return '<span class="bc-prepared" role="img" aria-label="整理：' + tool + '" title="整理：' + tool + '">' + tool + '</span>';
  }

  // 卡片最下方加註原本的固定編號（例如 AI-001）
  function origNo(c) {
    return c.code && c.code !== '待分配' ? '<p class="bc-orig">原編號 ' + esc(c.code) + '</p>' : '';
  }

  // mode = 'mini'（卡冊、日誌右欄：奶油白）／'full'（完整卡：深藍，可直接複製指令）
  function battleCard(e, mode, opts) {
    var c = e.card, s = c.series || { name: '', desc: '' }; opts = opts || {};
    var full = mode === 'full';
    var theme = domainTheme(c.domain);
    var head = '<header class="bc-head">' + emblem(s.name) +
      '<div class="bc-series">' + (s.name ? '<span class="bc-ribbon">' + esc(s.name) + '</span><span class="bc-sdesc">' + esc(s.desc) + '</span>' : '') + '</div>' +
      favBtn(e) + '</header>';
    var img = c.image;
    var thumb = img ? '<img class="bc-thumb" src="' + img.src + '" alt="" title="有示意圖" loading="lazy">' : '';
    // 示意圖點一下放大（2026-11-25）：手機上字小時可全螢幕看、可縮放
    var figure = img ? '<figure class="bc-figure"><button type="button" class="bc-zoom" data-zoom="' + img.src + '" aria-label="放大示意圖：' + esc(img.alt) + '"><img src="' + img.src + '" alt="' + esc(img.alt) + '" loading="lazy"></button><figcaption>示意圖：' + esc(img.alt) + '｜點圖放大</figcaption></figure>' : '';
    var code = '<p class="bc-code"><span>' + esc(cardCode(c) || 'AI') + '</span><span class="bc-domain">' + esc(c.domain || '工作職場') + '</span>' + (e.draft ? '<em>未公開</em>' : '') + (e.archived ? '<em class="arch">已封存</em>' : '') + (full ? '' : thumb) + '</p>';
    var name;
    if (full) name = '<h3 class="bc-name">' + esc(c.name) + '</h3>';
    else {
      var attr = opts.goto ? 'href="#' + opts.goto + '" data-goto="' + opts.goto + '"' : 'href="#/card/' + enc(e.id) + '"';
      name = '<h3 class="bc-name"><a class="bc-link" ' + attr + '>' + esc(c.name) + '</a></h3>';
    }
    var use = '<p class="bc-use">' + esc(c.use) + '</p>';
    var when = c.when.length ? '<section class="bc-row"><h4 class="bc-lab">' + ICON.target + '適用</h4><ul class="bc-list">' +
      c.when.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></section>' : '';
    if (!full) {
      return '<article class="bcard mini ' + theme + (opts.compact ? ' compact' : '') + '" style="--s:' + seriesColor(s.name) + '">' +
        head + code + name + use + (opts.compact ? '' : '<div class="bc-panel">' + when + '</div>') +
        '<footer class="bc-foot"><span>' + ICON.chat + '指令 ×' + c.prompts.length + '</span>' + cardArchBtn(e) + '<span class="bc-go">看小卡 →</span></footer>' + origNo(c) + '</article>';
    }
    // 有跨模型縮寫標籤的小卡，在 Prompt 標題下說明顏色（藍＝只看不改檔，紫＝會動手改檔）
    var xf = {}; c.prompts.forEach(function (p) { var k = xFamCls(p.label); if (k) xf[k] = 1; });
    var legend = (xf[' x-read'] || xf[' x-act']) ? '<p class="x-legend bc-xlegend">' + (xf[' x-read'] ? '<span class="x-chip x-read">藍</span>只看不改檔　' : '') + (xf[' x-act'] ? '<span class="x-chip x-act">紫</span>會動手改檔' : '') + '</p>' : '';
    var prompts = '<section class="bc-prompts" id="ch-copy' + (opts.suffix || '') + '"><h4 class="bc-ptitle">' + ICON.chat + 'Prompt</h4>' + legend +
      c.prompts.map(function (p, i) {
        var promptText = esc(p.text);
        if (c.promptOutline) {
          promptText = promptText.replace(/^([\t ]*\d+\.[\t ]+)([^：\n]{1,12})(?=：)/gm, '$1<strong>$2</strong>');
        }
        promptText = phMark(promptText);
        var head = (p.label ? '<span class="bc-plabel' + xFamCls(p.label) + '">' + esc(p.label) + '</span>' : '') +
          (p.en ? '<span class="bc-lang" role="group" aria-label="提示詞語言"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">EN</button></span>' : '');
        return '<div class="bc-prompt">' + (head ? '<div class="bc-phead">' + head + '</div>' : '') +
          '<pre data-l="zh"' + (c.promptOutline ? ' class="bc-prompt-outline"' : '') + '>' + promptText + '</pre>' +
          (p.en ? '<pre data-l="en" lang="en" hidden' + (c.promptOutline ? ' class="bc-prompt-outline"' : '') + '>' + phMark(esc(p.en)) + '</pre>' : '') +
          '<button type="button" class="bc-copy" data-copy="' + i + '" data-id="' + esc(e.id) + '" aria-label="複製指令：' + esc(p.label || p.text) + '">' + ICON.copy + '</button></div>';
      }).join('') + '</section>';
    var notFor = (c.notFor || []).length ? '<section class="bc-row bc-notfor"><h4 class="bc-lab">' + ICON.no + '不適用</h4><ul class="bc-list">' +
      c.notFor.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></section>' : '';
    // 使用說明（2026-11-25，舊稱注意）：「準備／限制／提醒」小主題依序排列，小主題變成小標籤
    var NOTE_ORDER = ['準備', '限制', '提醒'];
    var noteItems = c.notes.map(function (x, i) {
      var m = /^(準備|限制|提醒)[：:]\s*/.exec(x);
      return { k: m ? m[1] : '', html: m ? x.slice(m[0].length) : x, i: i };
    }).sort(function (a, b) { return (NOTE_ORDER.indexOf(a.k) + 9) % 9 - (NOTE_ORDER.indexOf(b.k) + 9) % 9 || a.i - b.i; });
    var notes = c.notes.length ? '<section class="bc-row bc-notes"><h4 class="bc-lab">' + ICON.info + '使用說明</h4><ul class="bc-list">' +
      noteItems.map(function (n) { return '<li' + (n.k ? ' class="has-k"' : '') + '>' + (n.k ? '<span class="nk nk-' + NOTE_ORDER.indexOf(n.k) + '">' + n.k + '</span>' : '') + n.html + '</li>'; }).join('') + '</ul></section>' : '';
    return '<article class="bcard full ' + theme + '" style="--s:' + seriesColor(s.name) + '">' + head + code + name +
      '<div class="bc-swash" aria-hidden="true"></div>' + use + figure +
      '<div class="bc-panel">' + when + notFor + prompts + notes + cardMore(c) + '</div>' +
      '<footer class="bc-foot"><span>' + ICON.book + '來源：' + (opts.inLog ? fmtDate(e.date) + ' 筆記' : '<a href="#/log/' + enc(e.logId || e.id) + '">' + fmtDate(e.date) + ' 筆記</a>') + preparedBadge(c.preparedBy) + '</span>' +
      '<span>指令 ×' + c.prompts.length + '</span>' + cardArchBtn(e) + '</footer>' + origNo(c) + '</article>';
  }

  // 完整卡的「完整資料」：預設收合，舊卡沒有這些欄位就不顯示
  function cardMore(c) {
    var practice = c.practice || [];
    var has = (c.steps || []).length || (c.tools || []).length || practice.length || (c.versions || []).length;
    if (!has) return '';
    var list = function (title, items, tag) {
      return items && items.length ? '<section class="bm-sec"><h5>' + title + '</h5><' + (tag || 'ul') + '>' +
        items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</' + (tag || 'ul') + '></section>' : '';
    };
    var rows = practice.map(function (p) {
      var hasLog = p.log && entries.some(function (x) { return x.id === p.log; });
      return '<li><span class="bm-state">' + esc(p.status) + '</span><strong>' + esc(p.project) + '</strong>' + (p.date ? '<small>' + esc(p.date) + '</small>' : '') +
        (p.how ? '<p>' + esc(p.how) + '</p>' : '') + (p.learned ? '<p>新學到：' + esc(p.learned) + '</p>' : '') +
        (p.result || hasLog ? '<p class="bm-links">' + (p.result ? '成果：' + p.result : '') + (hasLog ? '<a href="#/log/' + enc(p.log) + '">對應筆記 →</a>' : '') + '</p>' : '') + '</li>';
    }).join('');
    return '<details class="bc-more"><summary>完整資料<small>步驟、工具' + (practice.length ? '、實戰 ' + (c.practiceCount || 0) + ' 次' : '') + '</small></summary>' +
      list('操作步驟', c.steps, 'ol') + list('工具與來源', c.tools) +
      (practice.length ? '<section class="bm-sec"><h5>實戰紀錄（' + (c.practiceCount || 0) + ' 次，規劃應用不計入）</h5><ul class="bm-practice">' + rows + '</ul></section>' : '') +
      list('版本紀錄', c.versions) + '</details>';
  }

  function homeBtn() { return '<a class="btn" href="#/">⌂ 回首頁</a>'; }

  function cardCode(c) {
    var serial = /^AI-(\d+)$/.exec(c.code || '');
    var group = c.series && SERIES[c.series.name];
    if (!serial || !group) return c.code || '';
    var domain = c.domain === '家庭生活' ? 'H' : 'W';
    return domain + '-' + group.code + '-' + String(parseInt(serial[1], 10)).padStart(2, '0');
  }

  function cardName(c) {
    var code = cardCode(c);
    return (code ? code + '　' : '') + c.name;
  }

  function logPage(e) {
    var isNote = e.format === 'note';
    var chapters = e.sections.map(function (s, i) { return { id: 'ch-' + i, title: s.title }; });
    var related = (e.related || []).map(function (code) {
      return cards.filter(function (v) { return v.card.code === code; })[0];
    }).filter(Boolean);
    if (isNote && related.length) chapters.push({ id: 'ch-related', title: '相關小卡' });
    chapters.push({ id: 'ch-sources', title: '來源' });
    var logCards = cardsOfLog(e.id, e.archived);
    var stageId = function (i) { return i ? 'ch-card-' + i : 'ch-card'; };
    logCards.forEach(function (v, i) {
      chapters.push({ id: stageId(i), title: logCards.length > 1 ? v.card.name : '小卡', num: esc(cardCode(v.card) || '卡'), card: true });
    });
    var top3 = e.top3 && e.top3.length ? '<div class="top3"><div class="top3-head">3 points</div><ol>' +
      e.top3.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol></div>' : '';
    var harvest = logCards.length > 1
      ? '<ul class="harvest-list">' + logCards.map(function (v, i) {
          return '<li><a href="#' + stageId(i) + '" data-goto="' + stageId(i) + '"><span>' + esc(cardCode(v.card)) + '</span><strong>' + esc(v.card.name) + '</strong></a></li>';
        }).join('') + '</ul>'
      : (logCards[0] ? battleCard(logCards[0], 'mini', { goto: 'ch-card', compact: true }) : '');
    var relatedList = '<ul>' + related.map(function (v) {
      return '<li><a href="#/card/' + enc(v.id) + '">' + esc(cardName(v.card)) + ' →</a></li>';
    }).join('') + '</ul>';
    var relatedHtml = !related.length ? '' : isNote
      ? '<section id="ch-related" class="log-sec related-cards"><h2><span class="h-num">' + String(e.sections.length + 1).padStart(2, '0') + '</span>相關小卡</h2>' + relatedList + '</section>'
      : '<section class="related-cards"><h2>相關小卡</h2>' + relatedList + '</section>';
    var head = '<header class="lead' + (e.card ? ' has-harvest' : '') + '">' +
      '<div class="lead-main"><span class="kicker">筆記</span>' +
        (e.code ? '<p class="note-code">' + esc(e.code) + '</p>' : '') + '<h1>' + esc(e.title) + '</h1>' + metaLine(e) + (DATA.preview && !e.archived ? '<p class="lead-acts">' + actBtn('archive', 'log', e) + '</p>' : '') +
        (e.summary && !isNote ? '<p class="lede">' + esc(e.summary) + '</p>' : '') +
        (e.card ? top3 : '') +
        tagLinks(e.tags, 'logs') + '</div>' +
      (e.card ? '<aside class="harvest card-theme"><div class="harvest-head">本篇小卡' + (logCards.length > 1 ? ' ' + logCards.length + ' 張' : '') + '</div>' +
        harvest + '</aside>' : top3) +
      '</header>';
    var body = '<article class="article">' +
      e.sections.map(function (s, i) {
        return '<section id="ch-' + i + '" class="log-sec"><h2><span class="h-num">' + String(i + 1).padStart(2, '0') + '</span>' + esc(s.title) + '</h2>' + s.html + '</section>';
      }).join('') +
      relatedHtml + '<section id="ch-sources">' + sourcesHtml(e) + '</section></article>' +
      logCards.map(function (v, i) {
        return '<section id="' + stageId(i) + '" class="card-stage card-theme">' +
          '<div class="sec-head"><span class="en">CARD</span><span class="zh">本篇小卡</span></div>' +
          battleCard(v, 'full', { inLog: true, suffix: i ? '-' + i : '' }) +
          '<p class="stage-links"><a class="btn ghost" href="' + CLAUDE_URL + '" target="_blank" rel="noopener">開啟 Claude ↗</a>' +
          '<a href="#/card/' + enc(v.id) + '">單獨開啟這張小卡 →</a></p></section>';
      }).join('') +
      '<div class="actions">' + homeBtn() + '<a class="btn ghost" href="#/logs">← 回筆記列表</a></div>';
    return crumbs([{ title: e.archived ? '封存區' : '筆記', href: e.archived ? '#/archive' : '#/logs' }, { title: e.title }]) + archiveNote('log', e) + head +
      withChapters(chapters, body, 'CONTENTS｜本篇章節');
  }

  // 捲動時標示目前章節
  function watchChapters() {
    var btns = app.querySelectorAll('.chapters [data-goto]');
    if (!btns.length || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (items) {
      items.forEach(function (it) {
        if (!it.isIntersecting) return;
        btns.forEach(function (b) { b.classList.toggle('on', b.dataset.goto === it.target.id); });
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    btns.forEach(function (b) { var s = document.getElementById(b.dataset.goto); if (s) io.observe(s); });
  }

          codeTable('小卡欄位', [['T', '卡名', 'Title'], ['D', '用途', 'Description'], ['A', '適用', 'Applies to'], ['P', '提示詞', 'Prompt'], ['N', '使用說明', 'Notes'], ['BY', '整理標記', 'Prepared by']]) +
          '<p>跨模型縮寫（XR、XP、XE、XV、XC）的使用時機，見下方「跨模型縮寫」。</p>' +
          '<p>小卡代號＝領域－系別－號碼。<code>C W-DE-01 D 縮短</code> 是縮短第一張小卡的用途；<code>P2</code> 指第 2 段提示詞。原本的固定編號（例如 <code>AI-001</code>）繼續保留，新舊代號都能搜尋。</p>')) +
      sec('ab-x', '04', '跨模型縮寫', xTable()) +
      sec('ab-log', '05', '筆記怎麼寫',
        '<ol><li>做什麼（一句話）</li><li>怎麼做</li><li>學到什麼</li><li>相關小卡</li><li>來源</li></ol>' +
        '<p>寫短句，每項只說一件事；只寫真實用過的 AI 做法、程式或工具。</p><p>中英文之間要空格（數字也是）：寫「這是 AI 工作圖鑑」，不寫「這是AI工作圖鑑」。</p>') +
      sec('ab-rule', '06', '公開與安全',
        '<ul><li>新筆記先「不公開」，Lynn 看過預覽確認後才公開。</li>' +
        '<li>上傳 GitHub 前先在私人網址預覽；整段對話的修改都確認後，才一次上傳。</li>' +
        '<li>不寫客戶名、人名、統編、聯絡方式和電腦檔案路徑；程式發現可疑內容就停止更新。</li>' +
        '<li>內部來源只顯示「另有 N 份內部紀錄」，不顯示內容。</li>' +
        '<li><strong>封存</strong>：不要的筆記或小卡先封存，不直接刪除。封存後列表和公開網站都不顯示，私人網址的「封存區」看得到（上方選單「封存」）；之後再決定還原或刪除。封存按鈕在小卡卡尾、筆記標題下方，只在私人網址出現。刪掉的小卡編號不再使用。</li></ul>') +
      sec('ab-version', '07', '版次與更新',
        '<p>網站目前是 <strong>' + esc(DATA.version || '—') + '</strong>。版面或功能改變才升版號；新增筆記、小卡只看頁尾的更新日期。</p>' +
        '<h3 class="ab-h3">內容更新紀錄（自動）</h3><ul class="ab-log">' + (updates || '<li>尚無</li>') + '</ul>' +
        (changeList.length ? fold('網站改版紀錄（' + changeList.length + ' 筆）', '<ul class="ab-log">' + changes + '</ul>') : '')) +
      '</article><div class="actions">' + homeBtn() + '</div>';
    return crumbs([{ title: '說明' }]) +
      '<div class="sec-head"><span class="en">ABOUT</span><span class="zh">說明</span></div>' +
      '<p class="lede">先看筆記與小卡的差別，再看怎麼搜尋、複製和收藏。</p>' + withChapters(chapters, body, 'CONTENTS｜說明');
  }

  function notFound() { return '<p class="empty">找不到這一頁。<a href="#/">回首頁</a></p>'; }

  // ---------- 路由 ----------
  function render() {
    var hash = location.hash.replace(/^#/, '') || '/';
    var qi = hash.indexOf('?');
    var route = qi >= 0 ? hash.slice(0, qi) : hash;
    var params = new URLSearchParams(qi >= 0 ? hash.slice(qi + 1) : '');
    var parts = route.split('/').filter(Boolean);
    var nav = 'home', html, title = 'AI 工作圖鑑';
    var find = function (id) { var k = decodeURIComponent(id); return allEntries.filter(function (e) { return e.id === k || (e.code && e.code === k.toUpperCase()); })[0]; };
    var findCard = function (id) { return cards.concat(archivedCards).filter(function (e) { return e.id === decodeURIComponent(id); })[0]; };

    if (!parts.length) html = home();
    else if (parts[0] === 'logs') { nav = 'logs'; html = listPage('logs', params); title = '筆記｜AI 工作圖鑑'; }
    else if (parts[0] === 'about') { nav = 'about'; html = aboutPage(); title = '說明｜AI 工作圖鑑'; }
    else if (parts[0] === 'cards') { nav = 'cards'; html = listPage('cards', params); title = '小卡｜AI 工作圖鑑'; }
    else if (parts[0] === 'archive') { nav = 'archive'; html = archivePage(); title = '封存區｜AI 工作圖鑑'; }
    else if (parts[0] === 'log' && find(parts[1])) { nav = 'logs'; var e = find(parts[1]); html = logPage(e); title = e.title + '｜AI 工作圖鑑'; }
    else if (parts[0] === 'card' && findCard(parts[1])) { nav = 'cards'; var c = findCard(parts[1]); html = cardPage(c); title = c.card.name + '｜AI 工作圖鑑'; }
    else html = notFound();

    app.innerHTML = html;
    document.title = title;
    document.querySelectorAll('[data-nav]').forEach(function (a) { a.classList.toggle('on', a.dataset.nav === nav); });
    window.scrollTo(0, 0);
    document.getElementById('fab-home').hidden = !parts.length;
    var det = app.querySelector('details.chapters');
    if (det && window.matchMedia('(max-width: 820px)').matches) det.open = false;
    watchChapters();
    var go = params.get('go'), gt = go && document.getElementById(go);
    if (gt) gt.scrollIntoView({ block: 'start' });
  }

  app.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, a[data-goto]');
    if (!t) return;
    if (t.tagName === 'A') ev.preventDefault();
    if (t.hasAttribute('data-goto')) {
      var target = document.getElementById(t.dataset.goto);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var d = t.closest('details.chapters');
      if (d && window.matchMedia('(max-width: 820px)').matches) d.open = false;
    }
    if (t.hasAttribute('data-fav')) {
      var id = t.dataset.fav, f = getFavs(), i = f.indexOf(id), on = i < 0;
      if (on) f.push(id); else f.splice(i, 1);
      if (!setFavs(f)) { toast('⚠️ 這個瀏覽器不能儲存收藏'); return; }
      toast(on ? '✅ 已加入我的收藏' : '已取消收藏');
      // 正在看「我的收藏」時，重畫列表；其他頁只更新按鈕
      if (/[?&]fav=1/.test(location.hash) || location.hash === '' || location.hash === '#/') { var y = window.scrollY; render(); window.scrollTo(0, y); return; }
      document.querySelectorAll('[data-fav="' + id.replace(/"/g, '\\"') + '"]').forEach(function (b) {
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
        var nm = b.getAttribute('aria-label').split('：').slice(1).join('：');
        b.setAttribute('aria-label', (on ? '取消收藏' : '加入我的收藏') + '：' + nm);
        b.title = on ? '取消收藏' : '加入我的收藏';
      });
      document.querySelectorAll('[data-fav-count]').forEach(function (n) { n.textContent = favCount(); });
      return;
    }
    if (t.hasAttribute('data-act')) {
      var k = t.dataset.kind, it = (k === 'card' ? cards.concat(archivedCards) : allEntries).filter(function (x) { return x.id === t.dataset.id; })[0];
      if (it) copyText(requestText(t.dataset.act, k, it), '✅ 已複製' + ACT_LABEL[t.dataset.act] + '請求，貼給 Claude');
      return;
    }
    if (t.hasAttribute('data-zoom')) { openZoom(t.dataset.zoom, t.querySelector('img').alt, t); return; }
    if (t.hasAttribute('data-zoom-close')) { closeZoom(); return; }
    if (t.hasAttribute('data-copy')) {
      var e = cards.filter(function (x) { return x.id === t.dataset.id; })[0];
      var pr = e && e.card.prompts[+t.dataset.copy], box = t.closest('.bc-prompt');
      if (pr) copyText(box && box.dataset.lang === 'en' && pr.en ? pr.en : pr.text);
    }
    if (t.hasAttribute('data-lang')) {
      var bx = t.closest('.bc-prompt'), lg = t.dataset.lang;
      bx.dataset.lang = lg;
      bx.querySelectorAll('pre[data-l]').forEach(function (n) { n.hidden = n.dataset.l !== lg; });
      bx.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lg); });
    }
  });
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-quick]');
    if (b) copyText(DATA.quickPrompts[+b.dataset.quick].text);
    var q = ev.target.closest('[data-equick]');
    if (q) copyText(DATA.editPrompts[+q.dataset.equick].text);
    var x = ev.target.closest('[data-xquick]');
    if (x) copyText(DATA.xPrompts[+x.dataset.xquick].text);
  });
  app.addEventListener('submit', function (ev) {
    var f = ev.target.closest('form.search');
    if (!f) return;
    ev.preventDefault();
    var q = f.q.value.trim();
    var p = [];
    if (f.dataset.tag) p.push('tag=' + enc(f.dataset.tag));
    if (q) p.push('q=' + enc(q));
    location.hash = '#/' + f.dataset.base + (p.length ? '?' + p.join('&') : '');
  });

  // 頁面選單（2026-11-25）：上方分頁前面加圖示；左側固定一排圖示（手機改成底部列）。兩處用同一組圖示
  // v2.3：私人預覽版一直顯示「封存」，沒東西時頁面寫「封存區是空的」
  var PAGES = [
    { nav: 'home', href: '#/', label: '首頁', icon: SVG('<path d="M4 11l8-6.5 8 6.5"/><path d="M6.5 9.5v10h4.5v-5h2v5h4.5v-10"/>') },
    { nav: 'cards', href: '#/cards', label: '小卡', icon: SVG('<rect x="8" y="4.5" width="11" height="15" rx="2"/><path d="M5 7.5v10.5a2 2 0 0 0 2 2h8"/>') },
    { nav: 'logs', href: '#/logs', label: '筆記', icon: SVG('<path d="M6 3.5h9.5l3 3v14H6z"/><path d="M9 9.5h6.5M9 13h6.5M9 16.5h4"/>') },
    { nav: 'about', href: '#/about', label: '說明', icon: ICON.info }
  ];
  if (DATA.preview) PAGES.push({ nav: 'archive', href: '#/archive', label: '封存', icon: SVG('<rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5v11h14v-11M10 12.5h4"/>') });
  var navEl = document.querySelector('.nav');
  if (navEl) navEl.innerHTML = PAGES.map(function (p) { return '<a href="' + p.href + '" data-nav="' + p.nav + '">' + p.icon + '<span>' + p.label + '</span></a>'; }).join('');
  document.body.insertAdjacentHTML('afterbegin', '<nav class="rail" aria-label="頁面選單（側邊）">' + PAGES.map(function (p) {
    return '<a href="' + p.href + '" data-nav="' + p.nav + '" aria-label="' + p.label + '" title="' + p.label + '">' + p.icon + '<span class="rail-tip" aria-hidden="true">' + p.label + '</span></a>';
  }).join('') + '</nav>');
  document.body.classList.add('has-rail');
  if (DATA.preview) document.getElementById('draft-banner').hidden = false;
  if (DATA.built) document.getElementById('built').innerHTML = '<a href="#/about?go=ab-version">' + esc((DATA.version ? DATA.version + '｜' : '') + '更新：' + DATA.built) + '</a>';
  window.addEventListener('hashchange', render);
  // 從手機寬度拉回電腦寬度時，章節欄一律展開
  var mq = window.matchMedia('(max-width: 820px)');
  var onMq = function () { var d = app.querySelector('details.chapters'); if (d && !mq.matches) d.open = true; };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  // 示意圖放大檢視：全螢幕、可捲動，按「關閉」、點背景或 Esc 關閉
  var zoomBack = null;
  function openZoom(src, alt, from) {
    zoomBack = from;
    var box = document.createElement('div');
    box.className = 'zoom-box'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', '示意圖放大：' + alt);
    box.innerHTML = '<button type="button" class="zoom-close" data-zoom-close>✕ 關閉</button><div class="zoom-scroll"><img src="' + src + '" alt="' + esc(alt) + '"></div>';
    box.addEventListener('click', function (ev) { if (ev.target === box || ev.target.closest('[data-zoom-close]')) closeZoom(); });
    document.body.appendChild(box); document.body.classList.add('zooming');
    box.querySelector('.zoom-close').focus();
  }
  function closeZoom() {
    var box = document.querySelector('.zoom-box'); if (!box) return;
    box.remove(); document.body.classList.remove('zooming');
    if (zoomBack) zoomBack.focus();
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeZoom(); });
  render();
})();

</script>
</body>
